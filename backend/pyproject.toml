[project]
name = "braque-backend"
version = "0.1.0"
description = "Picasso API: FastAPI service that runs the Claude editing agent and renders videos with ffmpeg"
requires-python = ">=3.12"
authors = [{ name = "Keka Oweh" }]
dependencies = [
    "boto3>=1.40",
    "claude-agent-sdk>=0.2.174",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.7.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/kekaoweh/braque"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "moto[server]>=5.1",
]
